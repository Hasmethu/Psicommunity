<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Psicommunity — plataforma de conexão e agendamento de atendimento psicológico">
    <title>Meu perfil | Psicommunity</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/site.css">
</head>

<body data-page="perfil">
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container"><a class="brand" href="index.html"><span
                    class="brand-mark">✳</span>Psicommunity</a><button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#mainNav"><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="mainNav">
                <div class="navbar-nav ms-auto align-items-lg-center" id="nav-user"><a class="nav-link"
                        href="login.html">Entrar</a></div>
            </div>
        </div>
    </nav>
    <main class="auth-wrap">
        <div class="panel auth-card">
            <div class="eyebrow">Minha conta</div>
            <h1 class="h2">Dados pessoais</h1>
            <div id="notice" hidden></div>
            <form id="profile-form">
                <div class="mb-3"><label class="form-label">Nome completo</label><input class="form-control" name="name"
                        required></div>
                <div class="mb-3"><label class="form-label">CPF</label><input class="form-control" name="cpf" required>
                </div>
                <div class="mb-3"><label class="form-label">Telefone</label><input class="form-control" name="phone"
                        required></div>
                <div class="mb-4"><label class="form-label">E-mail</label><input class="form-control" name="email"
                        type="email" required></div><button class="btn btn-primary">Salvar alterações</button> <a
                    class="btn btn-outline-secondary" href="painel.html">Voltar</a>
            </form>
        </div>
    </main>
    <footer class="footer mt-5">
        <div class="container d-flex flex-wrap justify-content-between gap-2"><span>© <span id="year"></span>
                Psicommunity</span></div>
    </footer>
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
