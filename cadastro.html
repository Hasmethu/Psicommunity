<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Psicommunity — plataforma de conexão e agendamento de atendimento psicológico">
    <title>Criar conta | Psicommunity</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/site.css">
</head>

<body data-page="cadastro">
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container"><a class="brand" href="index.html"><span
                    class="brand-mark">✳</span>Psicommunity</a><button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#mainNav"><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="mainNav">
                <div class="navbar-nav ms-auto align-items-lg-center" id="nav-user"><a class="nav-link"
                        href="login.html">Entrar</a></div>
            </div>
        </div>
    </nav>
    <main class="auth-wrap">
        <div class="panel auth-card">
            <div class="eyebrow">Faça parte</div>
            <h1 class="h2">Criar uma conta</h1>
            <p class="muted">Preencha seus dados para começar.</p>
            <div id="notice" hidden></div>
            <form id="register-form">
                <div class="row g-3">
                    <div class="col-12"><label class="form-label">Nome completo *</label><input class="form-control"
                            name="name" required></div>
                    <div class="col-md-6"><label class="form-label">CPF *</label><input class="form-control" name="cpf"
                            inputmode="numeric" maxlength="14" required></div>
                    <div class="col-md-6"><label class="form-label">Telefone *</label><input class="form-control"
                            name="phone" required placeholder="(00) 00000-0000"></div>
                    <div class="col-md-6"><label class="form-label">E-mail *</label><input class="form-control"
                            name="email" type="email" required></div>
                    <div class="col-md-6"><label class="form-label">Senha * (mínimo 6 caracteres)</label><input
                            class="form-control" name="password" type="password" minlength="6" required></div>
                    <div class="col-12"><label class="form-label">Tipo de usuário *</label><select class="form-select"
                            name="role" required>
                            <option value="paciente">Paciente</option>
                            <option value="profissional">Profissional</option>
                            <option value="professor">Professor</option>
                            <option value="estudante">Estudante de Psicologia</option>
                        </select></div>
                    <div class="col-12" id="extra-profile" hidden>
                        <div class="profile-banner">
                            <h6>Identificação profissional ou acadêmica</h6><label class="form-label">Registro
                                profissional, instituição ou matrícula *</label><input class="form-control mb-2"
                                name="profileInfo" placeholder="CRP, instituição ou matrícula"><label
                                class="form-label">Área / especialidade</label><input class="form-control"
                                name="specialty" placeholder="Psicologia clínica"><label class="form-label mt-2">Local
                                de atendimento presencial</label><input class="form-control" name="location"
                                placeholder="Endereço ou clínica">
                        </div>
                    </div>
                    <div class="col-12"><button class="btn btn-primary btn-lg w-100">Concluir cadastro</button></div>
                </div>
            </form>
            <p class="small-note mt-3">Perfis profissionais e acadêmicos ficam pendentes até análise do administrador.
            </p>
        </div>
    </main>
    <footer class="footer mt-5">
        <div class="container d-flex flex-wrap justify-content-between gap-2"><span>© <span id="year"></span>
                Psicommunity</span></div>
    </footer>
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
