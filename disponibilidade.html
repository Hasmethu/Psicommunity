<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Psicommunity — plataforma de conexão e agendamento de atendimento psicológico">
    <title>Gerenciar disponibilidade | Psicommunity</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/site.css">
</head>

<body data-page="disponibilidade">
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container"><a class="brand" href="index.html"><span
                    class="brand-mark">✳</span>Psicommunity</a><button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#mainNav"><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="mainNav">
                <div class="navbar-nav ms-auto align-items-lg-center" id="nav-user"><a class="nav-link"
                        href="login.html">Entrar</a></div>
            </div>
        </div>
    </nav>
    <main class="page-wrap">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <div class="eyebrow">Área do atendente</div>
                <h1 class="h2">Gerenciar disponibilidade</h1>
            </div><a href="painel.html">Voltar ao painel</a>
        </div>
        <div class="row g-4">
            <div class="col-lg-5">
                <div class="panel p-4">
                    <h5>Adicionar horário livre</h5>
                    <form id="availability-form"><label class="form-label" for="slot-date">Data</label><input
                            class="form-control mb-3" type="date" id="slot-date" required><label class="form-label"
                            for="slot-time">Horário de início</label><select class="form-select mb-3" id="slot-time">
                            <option>08:00</option>
                            <option>09:00</option>
                            <option>10:00</option>
                            <option>11:00</option>
                            <option>13:00</option>
                            <option>14:00</option>
                            <option>15:00</option>
                            <option>16:00</option>
                            <option>17:00</option>
                        </select><button class="btn btn-primary w-100">Adicionar disponibilidade</button></form>
                </div>
            </div>
            <div class="col-lg-7">
                <div class="panel p-4">
                    <h5>Horários cadastrados</h5>
                    <div id="availability-list"></div>
                </div>
            </div>
        </div>
    </main>
    <footer class="footer mt-5">
        <div class="container d-flex flex-wrap justify-content-between gap-2"><span>© <span id="year"></span>
                Psicommunity</span></div>
    </footer>
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
